# Copy to config.toml (git-ignored) and edit. Every setting is optional; the command line wins.
# Defaults and explanations: adblock/config.py

hotkey = "F9"                  # toggle ad mode. Examples: "F9", "pause", "ctrl+alt+m". Not "F12" (reserved by Windows).
quit_hotkey = "ctrl+shift+F9"  # quit cleanly (unmutes Chrome) without leaving fullscreen
title_contains = "YouTube TV"
game = ""                      # e.g. "utah" - which game's score to show on the overlay
stream_delay_s = 45.0          # spoiler guard: how far YouTube TV runs behind ESPN's feed
pip = true
record = true
fps = 4.0
