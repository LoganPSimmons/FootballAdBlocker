# Copy to config.toml (git-ignored) and edit. Every setting is optional; the command line wins.
# Defaults and explanations: adblock/config.py

hotkey = "F9"                  # toggle ad mode. Examples: "F9", "pause", "ctrl+alt+m". Not "F12" (reserved by Windows).
quit_hotkey = "ctrl+shift+F9"  # quit cleanly (unmutes Chrome) without leaving fullscreen
title_contains = "YouTube TV|Fubo"  # the stream's Chrome window has one of these in its title ("|" separates alternatives)
game = ""                      # e.g. "utah" - which game's score to show on the overlay
stream_delay_s = 45.0          # spoiler guard: how far YouTube TV runs behind ESPN's feed
pip = true
auto = true                    # hide ads automatically; false = you toggle with the hotkey, the detector only watches
enter_ad_s = 5.0               # graphics missing this long -> ad. Higher = safer for live play, more ad leaks
exit_ad_frames = 3             # frames with the graphics back -> game (~0.75 s)
close_to_tray = false          # true: closing the control window hides it to the tray instead of quitting
scene = true                   # use the image model when requirements-ml.txt is installed
graphics = true                # the learned graphics guard the image model; false = the image model decides alone
# scene_drives = true          # false: the graphics rules drive and the model only vetoes / returns (--fused)
record = true
fps = 4.0
# label = ""                   # session folder label (default: the game, then "session")
# frame_width = 640            # recorded frame width in pixels (640 -> 640x360 when the stream is fullscreen)
# jpeg_quality = 75
# sessions_dir = "sessions"    # where recordings go; relative to the project folder unless absolute
